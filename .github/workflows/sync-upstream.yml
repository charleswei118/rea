name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'charleswei118/rea'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream morluto/rea into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
